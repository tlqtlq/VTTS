<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Vocabulary & Text Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
        }
        select, input[type="range"] {
            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            font-size: 14px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-container input {
            flex-grow: 1;
        }
        .speed-val {
            font-weight: 600;
            min-width: 30px;
        }
        .textarea-container {
            position: relative;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }
        .paste-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background-color: #24292f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .paste-btn:hover { background-color: #57606a; }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            color: #ffffff;
            border: 1px solid rgba(27,31,36,0.15);
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background-color: #2da44e; }
        .btn-primary:hover { background-color: #2c974b; }
        .btn-danger { background-color: #cf222e; }
        .btn-danger:hover { background-color: #b60215; }
        
        /* Interactive Reader Text Field */
        .reader-display {
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 15px;
            min-height: 150px;
            max-height: 350px;
            overflow-y: auto;
            background-color: #fafafa;
            line-height: 1.6;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .word-span {
            cursor: pointer;
            padding: 1px 2px;
            border-radius: 3px;
            transition: background-color 0.1s ease;
        }
        .word-span:hover {
            background-color: #eaeef2;
        }
        /* Light Blue Tracker Highlight */
        .word-span.highlight {
            background-color: #b3dbff !important;
            color: #003d73;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Interactive Text-to-Speech Reader</h1>
    
    <div class="controls-grid">
        <div class="control-group">
            <label for="voiceSelect">Voice Preference (Defaults to Male):</label>
            <select id="voiceSelect"><option>Loading voices...</option></select>
        </div>
        <div class="control-group">
            <label for="speedSlider">Speed Control:</label>
            <div class="slider-container">
                <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.1" value="1.0">
                <span id="speedVal" class="speed-val">1.0x</span>
            </div>
        </div>
    </div>

    <div class="textarea-container">
        <button id="pasteBtn" class="paste-btn">📋 Paste Text</button>
        <textarea id="textInput" placeholder="Paste your essay, vocabulary list, or notes here without any word limits..."></textarea>
    </div>

    <div class="button-group">
        <button id="playBtn" class="btn btn-primary">Start Playback</button>
    </div>

    <label style="display:block; margin-bottom:8px;">Interactive Tracking Board (Click any word to jump target):</label>
    <div id="readerDisplay" class="reader-display">Your formatted click-to-jump text wrapper will appear here once you paste or type text...</div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const playBtn = document.getElementById('playBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const readerDisplay = document.getElementById('readerDisplay');

    let wordsData = []; 
    let currentIndex = 0;
    let isPlaying = false;
    let currentUtterance = null;
    let selectedVoice = null;

    // Load available System Voices and prioritize an explicit English Male profile
    function loadVoices() {
        let voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        
        if(voices.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = "Default System Voice";
            voiceSelect.appendChild(opt);
            return;
        }

        // Broad filter prioritizing male profiles across operating systems
        let maleKeywords = ['male', 'david', 'microsoft david', 'google uk english male', 'daniel', 'premium male', 'guy', 'andrew', 'brian'];
        let sortedVoices = voices.filter(v => v.lang.startsWith('en')).sort((a, b) => {
            let aName = a.name.toLowerCase();
            let bName = b.name.toLowerCase();
            let aIsMale = maleKeywords.some(k => aName.includes(k));
            let bIsMale = maleKeywords.some(k => bName.includes(k));
            return bIsMale - aIsMale; 
        });

        sortedVoices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = voice.name;
            voiceSelect.appendChild(option);
        });
        
        // Auto-select preferred male voice base
        selectedVoice = sortedVoices[0] || voices[0];
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    voiceSelect.addEventListener('change', () => {
        const voices = window.speechSynthesis.getVoices();
        selectedVoice = voices.find(v => v.name === voiceSelect.value);
        if(isPlaying) { stopTTS(); startTTS(currentIndex); }
    });

    // Update Speed Output Element Text Display
    speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value).toFixed(1);
        speedVal.textContent = val + 'x';
        if (isPlaying) {
            // Hot-reload speed rate changes safely without losing tracking index
            stopTTS();
            startTTS(currentIndex);
        }
    });

    // Native clipboard implementation for text paste action shortcut 
    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            textInput.value = text;
            processTextToSpans();
        } catch (err) {
            alert("Could not access clipboard. Please use Ctrl+V or Cmd+V directly inside the box.");
        }
    });

    textInput.addEventListener('input', processTextToSpans);

    // Breaks raw strings down into individual word elements mapped cleanly with metadata indexes
    function processTextToSpans() {
        const rawText = textInput.value;
        if (!rawText.trim()) {
            readerDisplay.innerHTML = 'Your formatted click-to-jump text wrapper will appear here once you paste or type text...';
            wordsData = [];
            currentIndex = 0;
            return;
        }

        readerDisplay.innerHTML = '';
        wordsData = [];
        
        // Regex preserves structure while slicing character blocks safely
        const tokens = rawText.split(/(\s+)/);
        let wordCounter = 0;

        tokens.forEach(token => {
            if (token.trim() === '') {
                // Keep spaces structural layout 
                readerDisplay.appendChild(document.createTextNode(token));
            } else {
                const span = document.createElement('span');
                span.className = 'word-span';
                span.textContent = token;
                span.dataset.index = wordCounter;
                
                span.addEventListener('click', () => {
                    const targetIndex = parseInt(span.dataset.index);
                    jumpToWord(targetIndex);
                });

                readerDisplay.appendChild(span);
                wordsData.push({
                    word: token,
                    span: span
                });
                wordCounter++;
            }
        });
        currentIndex = 0;
    }

    function jumpToWord(index) {
        currentIndex = index;
        highlightWord(currentIndex);
        if (isPlaying) {
            stopTTS();
            startTTS(currentIndex);
        }
    }

    function highlightWord(index) {
        wordsData.forEach(wd => wd.span.classList.remove('highlight'));
        if (wordsData[index]) {
            const activeSpan = wordsData[index].span;
            activeSpan.classList.add('highlight');
            // Auto scroll container safely to track text view alignment gracefully
            activeSpan.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    // Sequentially speaks text sentence-by-sentence or block-by-block to prevent memory overloads
    function startTTS(startIndex) {
        if (wordsData.length === 0) return;
        isPlaying = true;
        playBtn.textContent = "Stop Playback";
        playBtn.className = "btn btn-danger";

        currentIndex = startIndex;
        
        // Piece together text elements dynamically starting from target point
        let wordsSlice = wordsData.slice(currentIndex).map(wd => wd.word);
        if (wordsSlice.length === 0) {
            stopTTS();
            return;
        }

        // Reconstruct words slice to engine speech segment block
        let textChunk = wordsSlice.join(' ');
        currentUtterance = new SpeechSynthesisUtterance(textChunk);
        
        if (selectedVoice) currentUtterance.voice = selectedVoice;
        currentUtterance.rate = parseFloat(speedSlider.value);

        // Native layout tracker configuration 
        currentUtterance.onboundary = function(event) {
            if (event.name === 'word') {
                // Calculate precise token array shifts dynamically based on engine boundary feedback
                let textPassed = event.utterance.text.substring(0, event.charIndex);
                let wordsPassedCount = textPassed.split(/\s+/).filter(w => w.length > 0).length;
                
                let actualIndex = startIndex + wordsPassedCount;
                if (actualIndex < wordsData.length) {
                    currentIndex = actualIndex;
                    highlightWord(currentIndex);
                }
            }
        };

        currentUtterance.onend = function() {
            // Loop functionality if end of string stream processing occurs naturally
            if (isPlaying) {
                currentIndex = 0;
                highlightWord(0);
                startTTS(0);
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    function stopTTS() {
        window.speechSynthesis.cancel();
        if(currentUtterance) {
            currentUtterance.onend = null;
        }
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if(currentIndex >= wordsData.length) currentIndex = 0;
            startTTS(currentIndex);
        } else {
            isPlaying = false;
            playBtn.textContent = "Start Playback";
            playBtn.className = "btn btn-primary";
            stopTTS();
        }
    });

    window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
    });
</script>

</body>
</html>
