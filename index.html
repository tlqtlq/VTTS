<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional English TTS Reader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
        }
        select, input[type="range"] {
            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            font-size: 14px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-container input {
            flex-grow: 1;
        }
        .speed-val {
            font-weight: 600;
            min-width: 30px;
        }
        .textarea-container {
            position: relative;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }
        .paste-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background-color: #24292f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .paste-btn:hover { background-color: #57606a; }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 2;
            color: #ffffff;
            border: 1px solid rgba(27,31,36,0.15);
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background-color: #2da44e; }
        .btn-primary:hover { background-color: #2c974b; }
        .btn-danger { background-color: #cf222e; }
        .btn-danger:hover { background-color: #b60215; }
        
        .btn-secondary {
            flex: 1;
            background-color: #f6f8fa;
            color: #24292f;
            border: 1px solid #d0d7de;
        }
        .btn-secondary:hover { background-color: #eaeef2; }
        
        /* Interactive Reader Text Field */
        .reader-display {
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 15px;
            min-height: 150px;
            max-height: 350px;
            overflow-y: auto;
            background-color: #fafafa;
            line-height: 1.6;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .word-span {
            cursor: pointer;
            padding: 1px 2px;
            border-radius: 3px;
            transition: background-color 0.1s ease;
        }
        .word-span:hover {
            background-color: #eaeef2;
        }
        /* Light Blue Tracker Highlight */
        .word-span.highlight {
            background-color: #b3dbff !important;
            color: #003d73;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Professional English Reader</h1>
    
    <div class="controls-grid">
        <div class="control-group">
            <label for="voiceSelect">Standard English Reader Profiles:</label>
            <select id="voiceSelect"><option>Detecting readers...</option></select>
        </div>
        <div class="control-group">
            <label for="speedSlider">Speed Control:</label>
            <div class="slider-container">
                <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.1" value="1.0">
                <span id="speedVal" class="speed-val">1.0x</span>
            </div>
        </div>
    </div>

    <div class="textarea-container">
        <button id="pasteBtn" class="paste-btn">📋 Paste Text</button>
        <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    </div>

    <div class="button-group">
        <button id="playBtn" class="btn btn-primary">Start Playback</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
    </div>

    <label style="display:block; margin-bottom:8px;">Interactive Tracking Board (Click any word to jump target):</label>
    <div id="readerDisplay" class="reader-display">Your formatted click-to-jump text wrapper will appear here once you paste or type text...</div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const playBtn = document.getElementById('playBtn');
    const clearBtn = document.getElementById('clearBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const readerDisplay = document.getElementById('readerDisplay');

    let wordsData = []; 
    let currentIndex = 0;
    let isPlaying = false;
    let currentUtterance = null;
    let selectedVoice = null;

    // Filters down purely to standard English readers, preventing joke/goofy voice matches
    function loadVoices() {
        let voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        
        if (voices.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = "Default System Voice";
            voiceSelect.appendChild(opt);
            return;
        }

        // Strict filters to parse standard English options and divide logically
        let englishVoices = voices.filter(v => v.lang.startsWith('en'));
        
        // Exclude known sound effects, novelty characters, or platform specific assistive layouts (like zarvox, cellos, etc.)
        let goofyKeywords = ['jester', 'clown', 'alien', 'whisper', ' Zarvox', 'Trinoids', 'Deranged', 'Hysterical', 'Cellos', 'Good News', 'Bells', 'Boing', 'Bubbles', 'Organ', 'Bad News', 'Pipe Organ'];
        let standardReaders = englishVoices.filter(v => !goofyKeywords.some(g => v.name.includes(g)));

        let maleKeywords = ['david', 'male', 'microsoft david', 'google uk english male', 'daniel', 'premium male', 'guy', 'andrew', 'brian', 'natural male', 'oliver', 'ryan'];
        
        let maleGroup = [];
        let femaleGroup = [];

        standardReaders.forEach(v => {
            let nameLower = v.name.toLowerCase();
            if (maleKeywords.some(k => nameLower.includes(k))) {
                maleGroup.push(v);
            } else {
                femaleGroup.push(v); // Defaults typical remaining system indexes as Female Readers safely
            }
        });

        // Populate cleanly segmented optgroups into the HTML DOM Select element
        if (maleGroup.length > 0) {
            const groupM = document.createElement('optgroup');
            groupM.label = "English Male Readers";
            maleGroup.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                groupM.appendChild(opt);
            });
            voiceSelect.appendChild(groupM);
        }

        if (femaleGroup.length > 0) {
            const groupF = document.createElement('optgroup');
            groupF.label = "English Female Readers";
            femaleGroup.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                groupF.appendChild(opt);
            });
            voiceSelect.appendChild(groupF);
        }

        // Fallback default setup selector assignment safely
        if (standardReaders.length > 0) {
            selectedVoice = maleGroup[0] || standardReaders[0];
            voiceSelect.value = selectedVoice.name;
        }
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    voiceSelect.addEventListener('change', () => {
        const voices = window.speechSynthesis.getVoices();
        selectedVoice = voices.find(v => v.name === voiceSelect.value);
        if (isPlaying) { stopTTS(); startTTS(currentIndex); }
    });

    speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value).toFixed(1);
        speedVal.textContent = val + 'x';
        if (isPlaying) {
            stopTTS();
            startTTS(currentIndex);
        }
    });

    // One-click paste mechanism
    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            textInput.value = text;
            processTextToSpans();
        } catch (err) {
            alert("Could not access clipboard automatically. Please use Ctrl+V or Cmd+V directly inside the box.");
        }
    });

    // Clear Button execution logic
    clearBtn.addEventListener('click', () => {
        isPlaying = false;
        playBtn.textContent = "Start Playback";
        playBtn.className = "btn btn-primary";
        stopTTS();
        
        textInput.value = '';
        processTextToSpans();
    });

    textInput.addEventListener('input', processTextToSpans);

    function processTextToSpans() {
        const rawText = textInput.value;
        if (!rawText.trim()) {
            readerDisplay.innerHTML = 'Your formatted click-to-jump text wrapper will appear here once you paste or type text...';
            wordsData = [];
            currentIndex = 0;
            return;
        }

        readerDisplay.innerHTML = '';
        wordsData = [];
        
        const tokens = rawText.split(/(\s+)/);
        let wordCounter = 0;

        tokens.forEach(token => {
            if (token.trim() === '') {
                readerDisplay.appendChild(document.createTextNode(token));
            } else {
                const span = document.createElement('span');
                span.className = 'word-span';
                span.textContent = token;
                span.dataset.index = wordCounter;
                
                span.addEventListener('click', () => {
                    const targetIndex = parseInt(span.dataset.index);
                    jumpToWord(targetIndex);
                });

                readerDisplay.appendChild(span);
                wordsData.push({
                    word: token,
                    span: span
                });
                wordCounter++;
            }
        });
        currentIndex = 0;
    }

    function jumpToWord(index) {
        currentIndex = index;
        highlightWord(currentIndex);
        if (isPlaying) {
            stopTTS();
            startTTS(currentIndex);
        }
    }

    function highlightWord(index) {
        wordsData.forEach(wd => wd.span.classList.remove('highlight'));
        if (wordsData[index]) {
            const activeSpan = wordsData[index].span;
            activeSpan.classList.add('highlight');
            activeSpan.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    function startTTS(startIndex) {
        if (wordsData.length === 0) return;
        isPlaying = true;
        playBtn.textContent = "Stop Playback";
        playBtn.className = "btn btn-danger";

        currentIndex = startIndex;
        
        let wordsSlice = wordsData.slice(currentIndex).map(wd => wd.word);
        if (wordsSlice.length === 0) {
            stopTTS();
            return;
        }

        let textChunk = wordsSlice.join(' ');
        currentUtterance = new SpeechSynthesisUtterance(textChunk);
        
        if (selectedVoice) currentUtterance.voice = selectedVoice;
        currentUtterance.rate = parseFloat(speedSlider.value);

        currentUtterance.onboundary = function(event) {
            if (event.name === 'word') {
                let textPassed = event.utterance.text.substring(0, event.charIndex);
                let wordsPassedCount = textPassed.split(/\s+/).filter(w => w.length > 0).length;
                
                let actualIndex = startIndex + wordsPassedCount;
                if (actualIndex < wordsData.length) {
                    currentIndex = actualIndex;
                    highlightWord(currentIndex);
                }
            }
        };

        currentUtterance.onend = function() {
            if (isPlaying) {
                currentIndex = 0;
                highlightWord(0);
                startTTS(0);
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    function stopTTS() {
        window.speechSynthesis.cancel();
        if (currentUtterance) {
            currentUtterance.onend = null;
        }
    }

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (currentIndex >= wordsData.length) currentIndex = 0;
            startTTS(currentIndex);
        } else {
            isPlaying = false;
            playBtn.textContent = "Start Playback";
            playBtn.className = "btn btn-primary";
            stopTTS();
        }
    });

    window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
    });
</script>

</body>
</html>
